[project]
name = "bengaluru-shield-sim"
version = "0.1.0"
description = "A minimal, reproducible SUMO traffic simulation for Bengaluru"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eclipse-sumo==1.27.1",
]

[project.scripts]
shield-sim = "bengaluru_sim.cli:main"
shield-gui = "bengaluru_sim.gui:main"
shield-closure = "bengaluru_sim.closure:main"
shield-calibrate = "bengaluru_sim.calibration:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bengaluru_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
